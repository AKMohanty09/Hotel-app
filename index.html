<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Saffron &amp; Hearth OS — Restaurant Management &amp; Digital Ordering</title>
    <meta
      name="description"
      content="Complete multi-portal restaurant operating system with permanent table QR verification, central order engine, Kitchen Display System, waiter service, billing, inventory, analytics, and delivery platform adapters."
    />
    <meta property="og:title" content="Saffron & Hearth OS" />
    <meta
      property="og:description"
      content="Unified Manager, Waiter, Kitchen KDS, and QR Customer Ordering Platform."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0E0B1D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SaffronPOS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('sh_theme_mode') || localStorage.getItem('sh_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0E0B1D' : '#F7F5FC');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-950 dark:text-slate-100 antialiased selection:bg-royal/25 selection:text-royal dark:selection:text-lavender">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
